[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lmarena"
version = "0.1.0"
description = "LLM model arena - compare models side-by-side, blind evaluation, track results"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "greyhush"}
]
keywords = ["llm", "evaluation", "comparison", "arena", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=10.0"]
dev = ["pytest>=7.0", "rich>=10.0"]

[project.scripts]
lmarena = "lmarena.cli:main"

[tool.setuptools.packages.find]
include = ["lmarena*"]
